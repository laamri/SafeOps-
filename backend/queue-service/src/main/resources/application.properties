spring.application.name=queue-service
server.port=8081

# --- database (overridden by SPRING_DATASOURCE_* in docker-compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/tiko
spring.datasource.username=tiko
spring.datasource.password=tiko
# Schema is owned by Flyway; Hibernate only checks that the entities match it.
# baseline-on-migrate adopts databases created by the previous ddl-auto=update setup.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
