spring.application.name=staff-admin
server.port=8084

# Internal only: this service publishes no host port, the api-gateway is the sole caller.
staff-admin.keycloak.base-url=${KEYCLOAK_INTERNAL_URL:http://localhost:8080}
staff-admin.keycloak.realm=tiko
staff-admin.keycloak.client-id=tiko-staff-admin
# in docker the secret comes from the file keycloak-init writes (spring.config.import)
staff-admin.keycloak.client-secret=${STAFF_ADMIN_CLIENT_SECRET:}

# Every request is authenticated here from the JWT itself. The X-Auth-* headers the gateway
# forwards are deliberately never read: this service does not trust its caller's routing.
staff-admin.security.issuer=${TOKEN_ISSUER:http://localhost:8080/realms/tiko}
staff-admin.security.jwk-set-uri=${TOKEN_JWKS_URL:http://localhost:8080/realms/tiko/protocol/openid-connect/certs}
staff-admin.security.audience=tiko-api

management.endpoints.web.exposure.include=health
