spring.application.name=profile-notification-service
server.port=8083

# Set SPRING_DATASOURCE_* in the runtime environment; defaults target a local service database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/profile_notifications}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:profile_notifications}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Schema is owned by Flyway; Hibernate only checks that the entities match it.
# baseline-on-migrate adopts databases created by the previous ddl-auto=update setup.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
