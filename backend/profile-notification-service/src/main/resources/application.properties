spring.application.name=profile-notification-service
server.port=8083

# Set SPRING_DATASOURCE_* in the runtime environment; defaults target a local service database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/profile_notifications}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:profile_notifications}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# MVP only; recommend migrating to Flyway-managed migrations before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
