spring.application.name=appointment-service
server.port=8082

# Set SPRING_DATASOURCE_* in the runtime environment; defaults target a local appointments DB.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appointments}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appointments}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Schema is owned by Flyway; Hibernate only checks that the entities match it.
# baseline-on-migrate adopts databases created by the previous ddl-auto=update setup.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Slice 1: establishment ids the service will accept appointments for. Unknown ids are a 400.
tiko.organizations=clinic,agency
