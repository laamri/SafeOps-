spring.application.name=appointment-service
server.port=8082

# Set SPRING_DATASOURCE_* in the runtime environment; defaults target a local appointments DB.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appointments}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appointments}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# MVP only; recommend migrating to Flyway-managed migrations before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health
