spring.application.name=api-gateway
server.port=8888

# Every value below can be overridden by an environment variable (PROVIDER_URL,
# PROVIDER_JWT_ISSUER, ...); docker-compose.yml does that. Defaults are for running locally.

# where the gateway itself reaches Keycloak (JWKS, token endpoint)
provider.url=http://localhost:8080
# the gateway's confidential client. The secret is never committed: in docker it comes from
# the file keycloak-init writes (spring.config.import), locally set PROVIDER_CLIENT_SECRET.
provider.client-id=tiko-backend
# log at startup whether a client_credentials token can be obtained and verified
provider.self-test=false

# --- JWT verification (provider.jwt.*) ---
# realm incoming tokens must come from; the expected issuer is
# provider.url + /realms/{realm} unless provider.jwt.issuer is set explicitly.
# Set the issuer when the gateway reaches Keycloak by another name than the browser does
# (docker: http://keycloak:8080 vs http://localhost:8080).
provider.jwt.realm=tiko
# only RS256; never add "none"
provider.jwt.allowed-algorithms=RS256
# access tokens only: refresh and id tokens are refused
provider.jwt.token-type=Bearer
# keycloak-init adds an audience mapper putting "tiko-api" in the tokens of the frontend and
# tiko-backend clients; a token minted for any other client is refused
provider.jwt.audiences=tiko-api
provider.jwt.clock-skew=30s
# signing keys are cached this long, and refetched sooner if an unknown kid shows up
provider.jwt.jwks-ttl=10m
# floor between two JWKS fetches, so forged kids cannot flood Keycloak
provider.jwt.jwks-min-refresh-interval=30s
# paths served without a token
provider.jwt.public-paths[0]=/actuator/**
provider.jwt.public-paths[1]=/auth/keys

# --- routes ---
# More specific API routes precede the queue-service fallback. The JWT filter above
# still verifies every non-public request and forwards its X-Auth-* headers.
spring.cloud.gateway.server.webmvc.routes[0].id=appointment-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${APPOINTMENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/appointments/**
spring.cloud.gateway.server.webmvc.routes[1].id=profile-notification-service-profile
spring.cloud.gateway.server.webmvc.routes[1].uri=${PROFILE_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/profile/**
spring.cloud.gateway.server.webmvc.routes[2].id=profile-notification-service-notifications
spring.cloud.gateway.server.webmvc.routes[2].uri=${PROFILE_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webmvc.routes[3].id=queue-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${QUEUE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/**

management.endpoints.web.exposure.include=health
