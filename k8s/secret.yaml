# Replace all REPLACE_WITH_* values before applying; see k8s/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: tiko-secrets
type: Opaque
stringData:
  POSTGRES_USER: tiko_admin
  POSTGRES_PASSWORD: REPLACE_WITH_POSTGRES_SUPERUSER_PASSWORD
  QUEUE_DB_USER: tiko
  QUEUE_DB_PASSWORD: REPLACE_WITH_QUEUE_DATABASE_PASSWORD
  APPOINTMENTS_DB_USER: appointments
  APPOINTMENTS_DB_PASSWORD: REPLACE_WITH_APPOINTMENTS_DATABASE_PASSWORD
  PROFILES_DB_USER: profile_notifications
  PROFILES_DB_PASSWORD: REPLACE_WITH_PROFILES_DATABASE_PASSWORD
  KC_ADMIN: admin
  KC_ADMIN_PASSWORD: REPLACE_WITH_KEYCLOAK_ADMIN_PASSWORD
  TIKO_CLIENT_PASSWORD: REPLACE_WITH_CLIENT_PASSWORD
  TIKO_AGENT_PASSWORD: REPLACE_WITH_AGENT_PASSWORD
  TIKO_ADMIN_PASSWORD: REPLACE_WITH_TEST_ADMIN_PASSWORD
  PROVIDER_CLIENT_ID: tiko-backend
  PROVIDER_CLIENT_SECRET: REPLACE_WITH_GATEWAY_CLIENT_SECRET
