apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tiko
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - keycloak.yaml
  - keycloak-bootstrap-job.yaml
  - queue-service.yaml
  - appointment-service.yaml
  - profile-notification-service.yaml
  - api-gateway.yaml
  - frontend.yaml
  - ingress.yaml
  - network-policies.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - db-init.sh
  - name: keycloak-bootstrap
    files:
      - keycloak-bootstrap.sh
generatorOptions:
  disableNameSuffixHash: false
