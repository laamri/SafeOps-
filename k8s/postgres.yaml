apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        role: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: postgres:17-alpine
          command: ["sh", "-c", "chown 70:70 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tiko-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tiko-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: QUEUE_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: tiko-config
                  key: QUEUE_DB_NAME
            - name: QUEUE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: tiko-secrets
                  key: QUEUE_DB_USER
            - name: QUEUE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tiko-secrets
                  key: QUEUE_DB_PASSWORD
            - name: APPOINTMENTS_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: tiko-config
                  key: APPOINTMENTS_DB_NAME
            - name: APPOINTMENTS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: tiko-secrets
                  key: APPOINTMENTS_DB_USER
            - name: APPOINTMENTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tiko-secrets
                  key: APPOINTMENTS_DB_PASSWORD
            - name: PROFILES_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: tiko-config
                  key: PROFILES_DB_NAME
            - name: PROFILES_DB_USER
              valueFrom:
                secretKeyRef:
                  name: tiko-secrets
                  key: PROFILES_DB_USER
            - name: PROFILES_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tiko-secrets
                  key: PROFILES_DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/10-init-databases.sh
              subPath: db-init.sh
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
            defaultMode: 0444
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
