apiVersion: v1
kind: ConfigMap
metadata:
  name: tiko-config
data:
  QUEUE_DB_NAME: tiko
  APPOINTMENTS_DB_NAME: appointments
  PROFILES_DB_NAME: profiles
  SPRING_DATASOURCE_URL_QUEUE: jdbc:postgresql://postgres:5432/tiko
  SPRING_DATASOURCE_URL_APPOINTMENTS: jdbc:postgresql://postgres:5432/appointments
  SPRING_DATASOURCE_URL_PROFILES: jdbc:postgresql://postgres:5432/profiles
  PROVIDER_URL: http://keycloak:8080
  PROVIDER_JWT_ISSUER: http://keycloak.tiko.local/realms/tiko
  PROVIDER_SELF_TEST: "true"
  QUEUE_SERVICE_URL: http://queue-service:8081
  APPOINTMENT_SERVICE_URL: http://appointment-service:8082
  PROFILE_SERVICE_URL: http://profile-notification-service:8083
  KC_HOSTNAME: http://keycloak.tiko.local
  KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
  KC_HEALTH_ENABLED: "true"
  KC_HTTP_ENABLED: "true"
  FRONTEND_ORIGINS: http://tiko.local,http://localhost:3000,http://localhost:5173
  FRONTEND_URL: http://tiko.local
